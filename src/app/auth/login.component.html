<section class="login-shell">
  <div class="login-card">
    <div class="login-intro">
      <span class="chip">Acces securise</span>
      <h2>Connectez-vous</h2>
      <p class="subtitle">
        Utilisez vos identifiants pour acceder a votre espace et suivre les cours, notes et seances.
      </p>

    </div>

    <form class="login-form" (ngSubmit)="submit()">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="votre.email@iit.tn" required />
      <p class="error" *ngIf="emailError">Email requis</p>

      <label for="password">Mot de passe</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="********" required />
      <p class="error" *ngIf="passwordError">Mot de passe requis</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
</section>
