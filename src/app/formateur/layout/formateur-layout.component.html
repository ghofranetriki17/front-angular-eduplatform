<section class="hero">
  <div>
    <p class="eyebrow">Espace Formateur</p>
    <h2>Bonjour {{ profile()?.prenom || 'Formateur' }} {{ profile()?.nom || '' }}</h2>
    <p class="lede">Pilotez vos cours, vos seances et la saisie des notes en temps reel.</p>
  </div>
  <div class="badge" *ngIf="profile() as p">
    <span class="role">{{ p.role }}</span>
    <span class="email">{{ p.email }}</span>
  </div>
</section>

<nav class="nav-grid">
  <a
    *ngFor="let item of navItems"
    [routerLink]="item.path"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: item.path.endsWith('/dashboard') }"
  >
    <span class="label">{{ item.label }}</span>
    <span class="hint">{{ item.description }}</span>
  </a>
</nav>

<section class="content">
  <router-outlet />
</section>
