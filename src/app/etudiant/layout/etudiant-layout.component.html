<section class="hero">
  <div>
    <p class="eyebrow">Espace Etudiant</p>
    <h2>Bienvenue {{ profile()?.prenom || 'Etudiant' }} {{ profile()?.nom || '' }}</h2>
    <p class="lede">Accedez a vos cours, notes, inscriptions et planning en un coup d'oeil.</p>
  </div>
  <div class="hero-actions">
    <app-notification-bell></app-notification-bell>
    <div class="badge" *ngIf="profile() as p">
      <span class="role">{{ p.role }}</span>
      <span class="email">{{ p.email }}</span>
    </div>
  </div>
</section>

<nav class="nav-grid">
  <a
    *ngFor="let item of navItems"
    [routerLink]="item.path"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: item.path.endsWith('/dashboard') }"
  >
    <span class="label">{{ item.label }}</span>
    <span class="hint">{{ item.description }}</span>
  </a>
</nav>

<section class="content">
  <router-outlet />
</section>
