<div class="app-shell">
  <header class="app-header" [class.compact]="isLoggedIn()">
    <div class="brand">
      <div class="brand-mark">CF</div>
      <div>
        <p class="kicker">Centre Formation</p>
        <h1>Campus Hub</h1>
      </div>
    </div>

    <nav class="nav" *ngIf="!isLoggedIn()">
      <a routerLink="/login" routerLinkActive="active">Connexion</a>
      <a routerLink="/etudiant" routerLinkActive="active">Espace Etudiant</a>
      <a routerLink="/formateur" routerLinkActive="active">Espace Formateur</a>
    </nav>

    <div class="profile" *ngIf="isLoggedIn(); else guest">
      <div class="profile-text">
        <span class="role">{{ profile()?.role }}</span>
        <strong>{{ profile()?.prenom }} {{ profile()?.nom }}</strong>
      </div>
      <a class="ghost" *ngIf="profileLink()" [routerLink]="profileLink()">Mon profil</a>
      <button class="ghost" (click)="logout()">Deconnexion</button>
    </div>
    <ng-template #guest>
      <div class="profile">
        <span class="role muted">Non connecte</span>
      </div>
    </ng-template>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
